<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DeepSeek</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      user-select: none;
      cursor: default;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; }
    .row { display: flex; align-items: center; gap: 18px; }
    .whale {
      width: 88px;
      height: 65px;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }
    .whale.show { opacity: 1; transform: scale(1); }
    .titles { display: flex; flex-direction: column; gap: 7px; }
    .line { display: flex; }
    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.42s cubic-bezier(.2,.8,.3,1.2),
                  transform 0.42s cubic-bezier(.2,.8,.3,1.2);
    }
    .line.show .char { opacity: 1; transform: translateY(0); }
    .line1 .char {
      font-size: 30px;
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.2px;
    }
    .line2 .char {
      font-size: 20px;
      font-weight: 600;
      color: rgba(0,0,0,0.75);
      letter-spacing: 0.2px;
    }
    .author {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    }
    .author.show { opacity: 1; transform: translateY(0); }
    .author .name { font-size: 18px; font-weight: 500; color: rgba(0,0,0,0.7); }
    .author .status { font-size: 13px; color: #808080; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <img class="whale" id="whale" src="whale.png" alt="" draggable="false">
      <div class="titles">
        <div class="line line1" id="line1"></div>
        <div class="line line2" id="line2"></div>
      </div>
    </div>
    <div class="author" id="author">
      <div class="name">by Condex</div>
      <div class="status" id="status">正在唤醒本地服务…</div>
    </div>
  </div>
  <script>
    (function () {
      function buildLine(el, text) {
        for (const ch of text) {
          const span = document.createElement('span');
          span.className = 'char';
          span.textContent = ch;
          el.appendChild(span);
        }
      }

      buildLine(document.getElementById('line1'), 'DeepSeek Harness');
      buildLine(document.getElementById('line2'), 'for Linux');

      const chars1 = document.querySelectorAll('#line1 .char');
      const chars2 = document.querySelectorAll('#line2 .char');
      chars1.forEach((el, i) => { el.style.transitionDelay = `${i * 0.07}s`; });
      chars2.forEach((el, i) => { el.style.transitionDelay = `${i * 0.07}s`; });

      setTimeout(() => document.getElementById('whale').classList.add('show'), 150);
      setTimeout(() => document.getElementById('line1').classList.add('show'), 300);
      setTimeout(() => document.getElementById('line2').classList.add('show'), 800);
      setTimeout(() => document.getElementById('author').classList.add('show'), 3200);

      if (window.deepseekDesktop && typeof window.deepseekDesktop.onStatus === 'function') {
        window.deepseekDesktop.onStatus((message) => {
          document.getElementById('status').textContent = message;
        });
      }
    })();
  </script>
</body>
</html>
